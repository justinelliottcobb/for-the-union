<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Simplified design for better visibility at small sizes -->
  
  <!-- Flag pole -->
  <rect x="6" y="2" width="2" height="28" fill="#2d3748"/>
  
  <!-- Flag - larger and more prominent -->
  <polygon points="8,4 8,16 24,13 24,7" fill="#e53e3e"/>
  <polygon points="24,7 26,8 26,12 24,13" fill="#c53030"/>
  
  <!-- Person silhouette - simplified -->
  <g fill="#2d3748">
    <!-- Head -->
    <circle cx="12" cy="21" r="2.5"/>
    
    <!-- Body -->
    <rect x="10.5" y="23.5" width="3" height="5" rx="0.5"/>
    
    <!-- Arm waving flag -->
    <rect x="8" y="25" width="4" height="1.5" rx="0.5" transform="rotate(-20 10 25.75)"/>
    
    <!-- Legs -->
    <rect x="10.5" y="28.5" width="1.2" height="3" rx="0.5"/>
    <rect x="12.3" y="28.5" width="1.2" height="3" rx="0.5"/>
  </g>
</svg>