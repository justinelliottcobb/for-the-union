<svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
  <!-- Ultra-simplified for 16x16 -->
  
  <!-- Flag pole -->
  <rect x="2" y="1" width="1" height="14" fill="#333"/>
  
  <!-- Flag -->
  <polygon points="3,1 3,8 11,7 11,2" fill="#e53e3e"/>
  
  <!-- Person -->
  <g fill="#333">
    <!-- Head -->
    <circle cx="5" cy="10" r="1"/>
    <!-- Body -->
    <rect x="4.5" y="11" width="1" height="2"/>
    <!-- Arm -->
    <rect x="3.5" y="11.5" width="1.5" height="0.5" transform="rotate(-15 4.25 11.75)"/>
    <!-- Legs -->
    <rect x="4.2" y="13" width="0.3" height="1"/>
    <rect x="4.8" y="13" width="0.3" height="1"/>
  </g>
</svg>